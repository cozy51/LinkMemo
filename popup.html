<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LinkMemo</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
          <div>
            <p class="eyebrow">WORK LAUNCHER</p>
            <h1>LinkMemo <span class="app-version" id="appVersion">v0.0.0</span></h1>
          </div>
        </div>
        <button class="icon-button" id="openOptions" type="button" aria-label="登録内容を編集" title="登録内容を編集">
          <span class="settings-emoji" aria-hidden="true">⚙️</span>
        </button>
      </header>

      <section class="summary" aria-label="登録状況">
        <div>
          <span class="summary-value" id="groupCount">0</span>
          <span class="summary-label">グループ</span>
        </div>
        <div class="summary-divider"></div>
        <div>
          <span class="summary-value" id="bookmarkCount">0</span>
          <span class="summary-label">リンク</span>
        </div>
        <button class="primary-button" id="openAll" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7L8 5Z"/></svg>
          すべてのタブを開く
        </button>
      </section>

      <div class="cloud-strip" aria-label="クラウド同期">
        <span class="cloud-sync-texts">
          <span class="cloud-sync-status" id="cloudSyncStatus" aria-live="polite">クラウド同期を確認中…</span>
          <span class="cloud-sync-detail" id="cloudSyncDetail" hidden></span>
        </span>
        <span class="cloud-strip-actions">
          <button class="cloud-chip is-danger" id="cloudSyncResolve" type="button" hidden>編集画面で確認</button>
          <button class="cloud-chip" id="cloudSyncNow" type="button" hidden>今すぐ同期</button>
        </span>
      </div>

      <div class="section-heading">
        <div>
          <p class="eyebrow">MY GROUPS</p>
          <h2>登録グループ</h2>
        </div>
        <button class="add-current-button" id="addCurrent" type="button">
          <span class="add-current-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M12 5v14M5 12h14"/>
            </svg>
          </span>
          <span>現在のタブを追加</span>
        </button>
      </div>

      <section class="groups" id="groups" aria-live="polite"></section>

      <section class="empty-state" id="emptyState" hidden>
        <div class="empty-icon" aria-hidden="true">↗</div>
        <h3>リンクはまだありません</h3>
        <p>今開いているページを追加するか、編集画面からURLを登録できます。</p>
        <button class="secondary-button" id="emptyAddCurrent" type="button">現在のタブを追加</button>
      </section>
    </main>

    <dialog id="addDialog">
      <form method="dialog" id="addForm">
        <div class="dialog-header">
          <div>
            <p class="eyebrow">QUICK ADD</p>
            <h2>現在のタブを追加</h2>
          </div>
          <button class="dialog-close" value="cancel" aria-label="閉じる">×</button>
        </div>
        <label>
          タイトル
          <input id="currentTitle" name="title" type="text" maxlength="160" required>
        </label>
        <label>
          URL
          <input id="currentUrl" name="url" type="url" readonly required>
        </label>
        <label>
          追加先グループ
          <select id="currentGroup" name="group" required></select>
        </label>
        <p class="form-error" id="addError" role="alert"></p>
        <div class="dialog-actions">
          <button class="cancel-button" value="cancel" type="button" id="cancelAdd">キャンセル</button>
          <button class="primary-button" type="submit">追加する</button>
        </div>
      </form>
    </dialog>

    <dialog class="confirm-dialog" id="openAllDialog" aria-labelledby="openAllDialogTitle">
      <form method="dialog">
        <div class="confirm-tabs-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M7 7h12v11H7z"/>
            <path d="M5 16H4V5h12v1"/>
            <path d="M10 11h6M13 8v6"/>
          </svg>
        </div>
        <div class="confirm-dialog-copy">
          <p class="eyebrow">CONFIRM</p>
          <h2 id="openAllDialogTitle">すべてのタブを開きますか？</h2>
          <p id="openAllConfirmText"></p>
        </div>
        <div class="dialog-actions">
          <button class="cancel-button" id="cancelOpenAll" type="button">キャンセル</button>
          <button class="primary-button" id="confirmOpenAll" type="button">すべてのタブを開く</button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="dev-preview.js"></script>
    <script src="sync-core.js"></script>
    <script src="supabase-client.js"></script>
    <script src="storage.js"></script>
    <script src="popup.js"></script>
    <script src="cloud-sync.js"></script>
  </body>
</html>
